# Pro6000 (Blackwell): Python >= 3.9 required for torch cu128 wheels.
# After create: pip install torch==2.8.0 torchvision --index-url https://download.pytorch.org/whl/cu128
# RTX 3090 (dell_rtx3090): Python 3.8 + torch 2.4+cu121 also works.
name: vqgan
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.9
  - pip<24.1
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch==2.8.0
    - torchvision
    - albumentations==0.4.3
    - opencv-python==4.9.0.80
    - pudb==2019.2
    - imageio==2.9.0
    - imageio-ffmpeg==0.4.2
    - pytorch-lightning==1.6.3
    - torchmetrics==0.9.3
    - packaging<22
    - omegaconf==2.0.6
    - test-tube>=0.7.5
    - streamlit>=0.73.1
    - einops==0.3.0
    - more-itertools>=8.0.0
    - transformers==4.3.1
    - monai==1.2
    - wandb>=0.12.0
    - click
    - packaging
    - requests
    - typing-extensions>=4.8
    - nibabel
    - wandb
    - -e .
