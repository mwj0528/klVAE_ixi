model:
  base_learning_rate: 2e-5
  target: taming.models.vqgan.VQModel
  params:
    num_classes: 3
    ckpt_path: /scratch2/mailab_yonsei/MW/CY/ALDM/VQ-GAN/logs/2026-07-13T17-45-13_adni_vqgan_stage1/vqgan-adni/2026-07-13T17-45-13_adni_vqgan_stage1/checkpoints/epoch=241-step=88572.ckpt
    ignore_keys: ["loss.discriminator"]
    stage: 2
    embed_dim: 3
    n_embed: 8192
    ddconfig:
      double_z: False
      z_channels: 3
      resolution: 128
      in_channels: 1
      out_ch: 1
      ch: 64
      ch_mult:
      - 1
      - 1
      - 2
      num_res_blocks: 2
      attn_resolutions: [8]
      dropout: 0.0

    lossconfig:
      target: taming.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: False
        disc_in_channels: 3
        disc_start: 0
        disc_weight: 0.5
        disc_factor: 0
        codebook_weight: 1.0
        num_classes: 4 # num_class + fake class

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 2
    num_workers: 6
    data_path: /scratch2/mailab_yonsei/MW/lustre/MRI/ADNI/3D/ADNI_datalist_3D.json
    train:
      target: taming.data.custom.ADNITrain
    validation:
      target: taming.data.custom.ADNIVal
    test:
      target: taming.data.custom.ADNITest

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 500
        max_images: 4
        clamp: True
